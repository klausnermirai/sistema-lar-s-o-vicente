name: Portaria facial
on:
  pull_request:
    paths:
      - 'components/FacialRecognitionCamera.tsx'
      - 'lib/faceRecognition.ts'
      - 'test_mudanca_016*.cjs'
      - '.github/workflows/portaria-facial.yml'
      - 'package*.json'
      - 'tsconfig.json'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node test_mudanca_016a.cjs && node test_mudanca_016c.cjs && node test_mudanca_016_1.cjs
